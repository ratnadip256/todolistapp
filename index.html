<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f5f5ef">
  <title>Daymark — a little more done</title>
  <style>
    :root {
      color-scheme: light;
      --paper: #f5f5ef;
      --surface: #fffefa;
      --ink: #202820;
      --muted: #777d70;
      --line: #e6e7dc;
      --green: #3f694b;
      --green-dark: #2d5038;
      --green-pale: #e8eee4;
      --coral: #c66b54;
      --shadow: 0 18px 60px rgb(39 52 37 / 8%);
    }

    * { box-sizing: border-box; }

    body {
      min-height: 100vh;
      margin: 0;
      color: var(--ink);
      background:
        radial-gradient(ellipse at 8% 12%, rgb(222 231 211 / 55%), transparent 29rem),
        radial-gradient(ellipse at 93% 88%, rgb(239 222 202 / 45%), transparent 26rem),
        var(--paper);
      font-family: "Avenir Next", Avenir, "Segoe UI", sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    button, input { font: inherit; }
    button { color: inherit; }

    .page {
      width: min(100% - 40px, 720px);
      margin: 0 auto;
      padding: 46px 0 64px;
    }

    .topline {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 66px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      font-family: Georgia, "Times New Roman", serif;
      font-size: 21px;
      letter-spacing: 0;
    }

    .brand-mark {
      display: grid;
      width: 30px;
      height: 30px;
      place-items: center;
      border-radius: 50%;
      color: var(--surface);
      background: var(--green);
    }

    .today {
      color: var(--muted);
      font-size: 13px;
      font-weight: 550;
    }

    .intro { margin-bottom: 31px; }

    .eyebrow {
      margin: 0 0 13px;
      color: var(--green);
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 1.5px;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(38px, 7vw, 54px);
      font-weight: 400;
      line-height: 1.08;
      letter-spacing: 0;
    }

    .subtitle {
      margin: 13px 0 0;
      color: var(--muted);
      font-size: 15px;
      line-height: 1.6;
    }

    .list-shell {
      overflow: hidden;
      border: 1px solid rgb(224 226 215 / 85%);
      border-radius: 8px;
      background: var(--surface);
      box-shadow: var(--shadow);
    }

    .add-form {
      display: flex;
      gap: 12px;
      padding: 18px;
      border-bottom: 1px solid var(--line);
    }

    .add-form input {
      min-width: 0;
      flex: 1;
      padding: 0 4px;
      border: 0;
      outline: none;
      color: var(--ink);
      background: transparent;
      font-size: 15px;
    }

    .add-form input::placeholder { color: #a1a397; }

    .add-button {
      display: inline-flex;
      min-height: 42px;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 0 16px;
      border: 0;
      border-radius: 5px;
      color: white;
      background: var(--green);
      cursor: pointer;
      font-size: 13px;
      font-weight: 650;
      transition: background 150ms ease, transform 150ms ease;
    }

    .add-button:hover { background: var(--green-dark); }
    .add-button:active { transform: scale(.98); }

    .list-heading {
      display: flex;
      align-items: center;
      justify-content: space-between;
      min-height: 57px;
      padding: 0 22px;
      border-bottom: 1px solid var(--line);
    }

    .list-heading h2 {
      margin: 0;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: .8px;
      text-transform: uppercase;
    }

    .count {
      color: var(--muted);
      font-size: 12px;
    }

    .tasks { margin: 0; padding: 0; list-style: none; }

    .task {
      display: flex;
      min-height: 62px;
      align-items: center;
      gap: 14px;
      padding: 10px 18px 10px 22px;
      border-bottom: 1px solid var(--line);
      animation: arrive 220ms ease both;
    }

    .task:last-child { border-bottom: 0; }

    @keyframes arrive {
      from { opacity: 0; transform: translateY(5px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .task-check {
      display: grid;
      width: 21px;
      height: 21px;
      flex: 0 0 21px;
      place-items: center;
      padding: 0;
      border: 1.5px solid #b9c0b2;
      border-radius: 50%;
      color: white;
      background: transparent;
      cursor: pointer;
      transition: background 150ms ease, border-color 150ms ease;
    }

    .task-check:hover { border-color: var(--green); }

    .task-text {
      min-width: 0;
      flex: 1;
      overflow-wrap: anywhere;
      font-size: 14px;
      line-height: 1.45;
    }

    .task.is-done .task-check {
      border-color: var(--green);
      background: var(--green);
    }

    .task.is-done .task-text {
      color: #9a9e93;
      text-decoration: line-through;
      text-decoration-color: #b1b5aa;
    }

    .delete-button {
      display: grid;
      width: 34px;
      height: 34px;
      flex: 0 0 34px;
      place-items: center;
      padding: 0;
      border: 0;
      border-radius: 5px;
      color: #96998f;
      background: transparent;
      cursor: pointer;
      opacity: 0;
      transition: opacity 150ms ease, color 150ms ease, background 150ms ease;
    }

    .task:hover .delete-button, .delete-button:focus-visible { opacity: 1; }
    .delete-button:hover { color: var(--coral); background: #f8eeea; }

    .empty-state {
      padding: 47px 20px 50px;
      color: var(--muted);
      text-align: center;
    }

    .empty-mark {
      display: grid;
      width: 44px;
      height: 44px;
      margin: 0 auto 13px;
      place-items: center;
      border-radius: 50%;
      color: var(--green);
      background: var(--green-pale);
    }

    .empty-state p { margin: 0; font-size: 14px; }

    .list-footer {
      display: flex;
      min-height: 58px;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 10px 18px 10px 22px;
      border-top: 1px solid var(--line);
    }

    .filters { display: flex; gap: 3px; }

    .filter-button, .clear-button {
      min-height: 32px;
      padding: 0 10px;
      border: 0;
      border-radius: 4px;
      color: var(--muted);
      background: transparent;
      cursor: pointer;
      font-size: 12px;
    }

    .filter-button:hover, .clear-button:hover { color: var(--ink); }

    .filter-button[aria-pressed="true"] {
      color: var(--green-dark);
      background: var(--green-pale);
      font-weight: 650;
    }

    .clear-button { padding-right: 2px; }
    .clear-button:disabled { cursor: default; opacity: .4; }

    .progress-row {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-top: 23px;
    }

    .progress-track {
      height: 4px;
      flex: 1;
      overflow: hidden;
      border-radius: 5px;
      background: #e2e5dc;
    }

    .progress-fill {
      width: 0;
      height: 100%;
      border-radius: inherit;
      background: #6e956b;
      transition: width 220ms ease;
    }

    .progress-label {
      min-width: 98px;
      color: var(--muted);
      font-size: 11px;
      text-align: right;
    }

    :focus-visible { outline: 2px solid #719374; outline-offset: 3px; }

    @media (max-width: 520px) {
      .page { width: min(100% - 28px, 720px); padding-top: 25px; }
      .topline { margin-bottom: 49px; }
      .add-form { gap: 7px; padding: 13px; }
      .add-button { padding: 0 12px; }
      .list-heading { padding: 0 16px; }
      .task { gap: 11px; padding-right: 11px; padding-left: 16px; }
      .delete-button { opacity: 1; }
      .list-footer { padding-right: 13px; padding-left: 13px; }
      .filter-button { padding: 0 8px; }
      .clear-button { font-size: 11px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; }
    }
  </style>
</head>
<body>
  <main class="page">
    <header class="topline">
      <div class="brand"><span class="brand-mark" aria-hidden="true">✓</span> daymark</div>
      <time class="today" id="today"></time>
    </header>

    <section class="intro" aria-labelledby="page-title">
      <p class="eyebrow">Your day, at your pace</p>
      <h1 id="page-title">A little more<br>done.</h1>
      <p class="subtitle">Make room for what matters today.</p>
    </section>

    <section class="list-shell" aria-label="Todo list">
      <form class="add-form" id="add-form">
        <input id="new-task" type="text" maxlength="200" placeholder="What needs doing?" aria-label="New task" autocomplete="off" required>
        <button class="add-button" type="submit"><span aria-hidden="true">+</span> Add task</button>
      </form>
      <div class="list-heading">
        <h2>My tasks</h2>
        <span class="count" id="task-count" aria-live="polite"></span>
      </div>
      <ul class="tasks" id="tasks" aria-label="Tasks"></ul>
      <div class="list-footer">
        <nav class="filters" aria-label="Filter tasks">
          <button class="filter-button" type="button" data-filter="all" aria-pressed="true">All</button>
          <button class="filter-button" type="button" data-filter="active" aria-pressed="false">Active</button>
          <button class="filter-button" type="button" data-filter="completed" aria-pressed="false">Done</button>
        </nav>
        <button class="clear-button" id="clear-completed" type="button">Clear completed</button>
      </div>
    </section>

    <div class="progress-row" aria-label="Daily progress">
      <div class="progress-track" aria-hidden="true"><div class="progress-fill" id="progress-fill"></div></div>
      <span class="progress-label" id="progress-label"></span>
    </div>
  </main>

  <script>
    const STORAGE_KEY = "daymark-tasks-v1";
    const form = document.querySelector("#add-form");
    const input = document.querySelector("#new-task");
    const taskList = document.querySelector("#tasks");
    const taskCount = document.querySelector("#task-count");
    const clearCompletedButton = document.querySelector("#clear-completed");
    const progressFill = document.querySelector("#progress-fill");
    const progressLabel = document.querySelector("#progress-label");
    let activeFilter = "all";
    let tasks = loadTasks();

    function loadTasks() {
      try {
        const savedTasks = JSON.parse(localStorage.getItem(STORAGE_KEY) || "[]");
        return Array.isArray(savedTasks)
          ? savedTasks.filter((task) => task && typeof task.id === "string" && typeof task.text === "string" && typeof task.done === "boolean")
          : [];
      } catch {
        return [];
      }
    }

    function saveTasks() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(tasks));
    }

    function makeTaskElement(task) {
      const item = document.createElement("li");
      item.className = `task${task.done ? " is-done" : ""}`;

      const toggle = document.createElement("button");
      toggle.className = "task-check";
      toggle.type = "button";
      toggle.setAttribute("aria-label", task.done ? `Mark ${task.text} active` : `Complete ${task.text}`);
      toggle.setAttribute("aria-pressed", String(task.done));
      if (task.done) toggle.innerHTML = '<svg width="12" height="12" viewBox="0 0 12 12" fill="none" aria-hidden="true"><path d="m2.2 6.2 2.4 2.3 5.2-5" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg>';
      toggle.addEventListener("click", () => {
        task.done = !task.done;
        saveTasks();
        render();
      });

      const text = document.createElement("span");
      text.className = "task-text";
      text.textContent = task.text;

      const remove = document.createElement("button");
      remove.className = "delete-button";
      remove.type = "button";
      remove.setAttribute("aria-label", `Delete ${task.text}`);
      remove.title = "Delete task";
      remove.innerHTML = '<svg width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M3.5 4.5h9m-7.5 0v7m3-7v7m3-7v7m-7.5-8h6l.5 1h-7l.5-1Zm-1 1h8l-.5 9h-7l-.5-9Z" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/></svg>';
      remove.addEventListener("click", () => {
        tasks = tasks.filter((entry) => entry.id !== task.id);
        saveTasks();
        render();
      });

      item.append(toggle, text, remove);
      return item;
    }

    function render() {
      const visibleTasks = tasks.filter((task) => {
        if (activeFilter === "active") return !task.done;
        if (activeFilter === "completed") return task.done;
        return true;
      });
      taskList.replaceChildren(...visibleTasks.map(makeTaskElement));

      if (visibleTasks.length === 0) {
        const empty = document.createElement("li");
        empty.className = "empty-state";
        const mark = document.createElement("div");
        mark.className = "empty-mark";
        mark.setAttribute("aria-hidden", "true");
        mark.textContent = "✓";
        const message = document.createElement("p");
        message.textContent = activeFilter === "completed" ? "Nothing checked off just yet." : activeFilter === "active" ? "You're all caught up." : "A clear list is a lovely place to start.";
        empty.append(mark, message);
        taskList.append(empty);
      }

      const remaining = tasks.filter((task) => !task.done).length;
      const completed = tasks.length - remaining;
      taskCount.textContent = `${remaining} ${remaining === 1 ? "left" : "left"}`;
      clearCompletedButton.disabled = completed === 0;
      progressFill.style.width = `${tasks.length ? (completed / tasks.length) * 100 : 0}%`;
      progressLabel.textContent = tasks.length ? `${completed} of ${tasks.length} complete` : "Ready when you are";
    }

    form.addEventListener("submit", (event) => {
      event.preventDefault();
      const text = input.value.trim();
      if (!text) return;
      tasks.unshift({ id: crypto.randomUUID(), text, done: false });
      saveTasks();
      activeFilter = "all";
      document.querySelector('[data-filter="all"]').setAttribute("aria-pressed", "true");
      document.querySelectorAll(".filter-button:not([data-filter='all'])").forEach((button) => button.setAttribute("aria-pressed", "false"));
      input.value = "";
      render();
      input.focus();
    });

    document.querySelectorAll(".filter-button").forEach((button) => {
      button.addEventListener("click", () => {
        activeFilter = button.dataset.filter;
        document.querySelectorAll(".filter-button").forEach((filterButton) => {
          filterButton.setAttribute("aria-pressed", String(filterButton === button));
        });
        render();
      });
    });

    clearCompletedButton.addEventListener("click", () => {
      tasks = tasks.filter((task) => !task.done);
      saveTasks();
      render();
    });

    document.querySelector("#today").textContent = new Intl.DateTimeFormat(undefined, {
      weekday: "long", month: "long", day: "numeric"
    }).format(new Date());

    render();
  </script>
</body>
</html>
